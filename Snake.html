<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050a16">
<meta name="description" content="Neon//Snake — a polished arcade snake game with modes, power-ups, shop, missions and local leaderboard.">
<title>NEON//SNAKE — Arcade Universe</title>
<style>
:root{--ac:#35f2c8;--ac2:#7c5cff;--hot:#ff4d8d;--gold:#ffd166;--bg:#07070f;--line:#ffffff1f;--muted:#a3a9c7;--white:#f4f6ff;--cyan:#35f2c8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{min-height:100vh;padding:max(10px,env(safe-area-inset-top)) 12px max(10px,env(safe-area-inset-bottom));background:radial-gradient(900px 500px at 12% -10%,#2a1b6b88,transparent),radial-gradient(800px 500px at 100% 110%,#0b5c5a66,transparent),var(--bg) fixed;color:var(--white);font:14px/1.45 ui-rounded,"Segoe UI",system-ui,sans-serif;user-select:none;-webkit-user-select:none;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{border:1px solid var(--line);background:#ffffff10;border-radius:99px;padding:9px 16px;cursor:pointer;font-weight:600;transition:background .15s,transform .1s,box-shadow .15s}
button:hover:not(:disabled){background:#ffffff22}
button:active:not(:disabled){transform:scale(.96)}
button:disabled{opacity:.4;cursor:default}
button.primary{border:0;color:#04120f;background:linear-gradient(120deg,var(--ac),#8cf7a0);font-weight:800;box-shadow:0 8px 28px #35f2c850}
button.primary:hover:not(:disabled){background:linear-gradient(120deg,#6bffdc,#b6ffc0)}
button.danger{color:#ff9fb9;border-color:#ff4d8d66}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
input,select{background:#ffffff12;border:1px solid var(--line);border-radius:10px;padding:7px 10px;max-width:100%}
select option{background:#14162b}
input[type=range]{accent-color:var(--ac);padding:0;width:130px}
input[type=checkbox]{accent-color:var(--ac);width:20px;height:20px}
.app{max-width:1000px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.logo{font:900 italic 28px/1 "Arial Black",ui-rounded,system-ui,sans-serif;letter-spacing:1px;background:linear-gradient(90deg,var(--ac),var(--ac2) 60%,var(--hot));-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{font-size:11px;color:var(--muted);margin-top:4px}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.actions button{font-size:13px;padding:8px 14px}
.arena{position:relative;padding:5px;border-radius:24px;background:linear-gradient(135deg,var(--ac),var(--ac2) 55%,var(--hot));box-shadow:0 0 70px #7c5cff45,0 24px 60px #000a}
canvas{display:block;width:100%;aspect-ratio:3/2;border-radius:19px;touch-action:none;background:#0a0b18}
.hud{position:absolute;z-index:2;top:16px;left:16px;right:16px;display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:start;pointer-events:none}
.pill{background:#0a0b1899;backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;padding:5px 12px;min-width:84px}
.pill.r{justify-self:end}
.pill small{display:block;color:var(--muted);font-size:11px;line-height:1.2}
.pill b{font-size:19px;font-variant-numeric:tabular-nums}
.score{text-align:center;text-shadow:0 2px 18px #000}
.score b{display:block;font:900 clamp(30px,6vw,46px)/1 "Arial Black",ui-rounded,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.status{margin-top:4px;min-height:22px;font-size:12px;color:var(--muted)}
.bar{height:5px;background:#ffffff1c;border-radius:9px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .2s}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;background:linear-gradient(120deg,var(--ac2),var(--hot));font-size:12px;font-weight:800;color:#fff;margin:0 2px}
.ov{position:absolute;inset:5px;z-index:3;background:radial-gradient(ellipse at 50% 40%,#1b1250dd,#05050cf0);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;border-radius:19px}
.ov.hidden{display:none}
.ov h1{margin:0 0 10px;font:900 italic clamp(32px,8vw,64px)/1 "Arial Black",ui-rounded,system-ui,sans-serif;background:linear-gradient(90deg,var(--ac),var(--ac2) 60%,var(--hot));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px #7c5cff80)}
.ov p{margin:0 auto 18px;max-width:420px;color:#c3c8e6}
.ov .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ov button.primary{font-size:17px;padding:13px 34px}
.badge{color:var(--gold);font-weight:800;margin-bottom:6px}
.hint{text-align:center;color:var(--muted);font-size:12px;margin:10px 0 0}
.dpad{display:none;grid-template-columns:repeat(3,62px);gap:8px;justify-content:center;margin-top:12px}
.dpad button{height:56px;border-radius:18px;font-size:20px;padding:0}
.scrim{position:fixed;inset:0;background:#000a;z-index:39;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.on{opacity:1;pointer-events:auto}
.side{position:fixed;top:0;right:0;bottom:0;width:min(390px,92vw);z-index:40;padding:max(14px,env(safe-area-inset-top)) 16px 16px;background:#0d0f1cf5;backdrop-filter:blur(14px);border-left:1px solid var(--line);overflow:auto;transform:translateX(105%);transition:transform .25s ease}
.side.open{transform:none}
.sidehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sidehead b{font-size:17px}
.tabs{display:flex;gap:4px;padding:4px;background:#ffffff0d;border-radius:99px;margin-bottom:14px}
.tabs button{flex:1;padding:8px 4px;font-size:12px;border:0;background:transparent}
.tabs button[aria-selected=true]{background:linear-gradient(120deg,var(--ac2),var(--hot));color:#fff}
h2{font-size:13px;margin:16px 0 8px;color:var(--ac)}
h2:first-child{margin-top:0}
.row2{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #ffffff10;font-size:13px}
.row2:last-child{border:0}
.row2 small{display:block;color:var(--muted);font-size:11px}
.row2 b{font-variant-numeric:tabular-nums}
.row2 button{padding:6px 14px;font-size:12px}
.mode{width:100%;text-align:left;margin-bottom:7px;border-radius:16px;padding:11px 14px}
.mode[aria-pressed=true]{background:linear-gradient(120deg,#7c5cff55,#35f2c833);border-color:var(--ac)}
.mode small{display:block;color:var(--muted);font-size:11px;font-weight:400}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid #fff6;flex:none}
.card{background:#ffffff0d;border:1px solid var(--line);border-radius:16px;padding:12px}
.sm{font-size:12px;color:var(--muted)}
.toasts{position:fixed;left:50%;transform:translateX(-50%);top:12px;display:grid;gap:7px;z-index:60;pointer-events:none;justify-items:center}
.toasts div{background:#14162bf0;border:1px solid var(--ac);border-radius:99px;padding:8px 18px;font-size:13px;font-weight:600;box-shadow:0 0 24px #35f2c840;animation:in .2s ease}
@keyframes in{from{opacity:0;transform:translateY(-10px)}}
@media(max-width:600px){.hud{top:10px;left:10px;right:10px}.pill{min-width:64px;padding:4px 9px}.pill b{font-size:16px}.logo{font-size:22px}}
@media(pointer:coarse){.dpad{display:grid}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header>
 <div><div class="logo">NEON//SNAKE</div><div class="tag">Arcade Universe</div></div>
 <div class="actions">
  <button id="bPause">Pause</button>
  <button id="bSound">Sound: On</button>
  <button id="bFull">Fullscreen</button>
  <button id="bMenu" class="primary">Menu</button>
 </div>
</header>
<div class="arena">
 <canvas id="c" aria-label="Snake game board"></canvas>
 <div class="hud">
  <div class="pill"><small>Best</small><b id="hBest">0</b></div>
  <div class="score"><b id="hScore">0</b><div id="hStatus" class="status">Ready</div></div>
  <div class="pill r"><small>Level</small><b id="hLevel">1</b><div class="bar"><i id="hBar"></i></div></div>
 </div>
 <div id="ov" class="ov"><div id="ovBox"></div></div>
</div>
<div class="dpad">
 <span></span><button data-d="u" aria-label="Up">▲</button><span></span>
 <button data-d="l" aria-label="Left">◀</button><button data-d="d" aria-label="Down">▼</button><button data-d="r" aria-label="Right">▶</button>
</div>
<p class="hint">Arrows / WASD to steer · Space to pause · Enter to start · M to mute · swipe on touch</p>
</div>
<div id="scrim" class="scrim"></div>
<aside id="side" class="side" aria-label="Game menu">
 <div class="sidehead"><b>Game menu</b><button id="bClose">Close</button></div>
 <div class="tabs" role="tablist">
  <button role="tab" data-t="play">Play</button>
  <button role="tab" data-t="shop">Shop</button>
  <button role="tab" data-t="me">Profile</button>
  <button role="tab" data-t="set">Settings</button>
 </div>
 <div id="tab"></div>
</aside>
<div id="toasts" class="toasts" role="status"></div>

<script>
(()=>{'use strict';
const $=s=>document.querySelector(s);
const W=720,H=480,KEY='neonSnakeV3',OLD='neonSnakeV2Profile';
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Data ---------- */
const BOARDS={small:[24,16],medium:[36,24],large:[45,30]};
const DIFF={easy:{base:150,min:75,step:3,pts:.8},normal:{base:125,min:58,step:4,pts:1},hard:{base:100,min:44,step:5,pts:1.4}};
const MODES={
 classic:['Classic','Eat, grow and chase the high score.'],
 obstacle:['Obstacles','Steer around fixed barriers. +20% points.'],
 survival:['Survival','Speed climbs and new hazards appear. +30% points.'],
 zen:['Zen','No crashes, no obstacles. Just flow.']};
const SKINS=[
 {id:'neon',n:'Neon Blue',a:'#42eaff',b:'#1b7bff',p:0},
 {id:'matrix',n:'Matrix Green',a:'#6dff8a',b:'#12a84a',p:80},
 {id:'flame',n:'Crimson Flame',a:'#ff6a5c',b:'#ffb347',p:120},
 {id:'gold',n:'Royal Gold',a:'#ffe27a',b:'#d99a1e',p:160},
 {id:'violet',n:'Cosmic Violet',a:'#c8a2ff',b:'#6a3cff',p:190},
 {id:'ghost',n:'Ghost Phantom',a:'#eaf3ff',b:'#7f93b3',p:250},
 {id:'prism',n:'Rainbow Prism',a:'rainbow',b:'#fff',p:320}];
const THEMES=[
 {id:'cyber',n:'Cyber City',a:'#12304d',b:'#040a17',g:'#42eaff',p:0},
 {id:'matrix',n:'Matrix Core',a:'#12391e',b:'#020a06',g:'#5cff75',p:100},
 {id:'synth',n:'Synthwave',a:'#43205a',b:'#10061c',g:'#ff6bd6',p:150},
 {id:'lava',n:'Magma World',a:'#4d211c',b:'#140807',g:'#ff8b4b',p:220},
 {id:'ocean',n:'Abyss Ocean',a:'#064556',b:'#03101e',g:'#4be7ff',p:280}];
const FOOD={normal:{c:'#53ffac',pts:10},gold:{c:'#ffda69',pts:50},double:{c:'#ff53d8',pts:25},shield:{c:'#42eaff',pts:20},slow:{c:'#b99aff',pts:20}};
const POWER={double:'Double score',shield:'Shield',slow:'Slow motion'};

const DEF={name:'Player',coins:0,best:0,foods:0,games:0,buys:0,ach:[],
 own:{skin:['neon'],theme:['cyber']},skin:'neon',theme:'cyber',mode:'classic',
 records:{},scores:[],day:'',daily:0,claimed:false,
 set:{diff:'normal',board:'medium',walls:'wrap',vol:60,grid:true,fx:true,reduce:false,shake:true,haptic:true,pause:true}};

/* ---------- Save system ---------- */
let P=load(),notice='';
function load(){
 const p=JSON.parse(JSON.stringify(DEF));
 p.set.reduce=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches);
 try{
  const s=JSON.parse(localStorage.getItem(KEY)||'null');
  if(s&&typeof s==='object'){
   Object.assign(p,s);
   p.set=Object.assign({},DEF.set,s.set||{});
   p.own=Object.assign({},DEF.own,s.own||{});
  }else{
   const o=JSON.parse(localStorage.getItem(OLD)||'null');
   if(o){p.name=o.name||p.name;p.best=o.best|0;p.coins=o.coins|0;p.foods=o.totalFood|0;p.games=o.games|0;notice='Progress imported from v2';}
  }
 }catch(e){}
 ['skin','theme'].forEach(k=>{if(!(k==='skin'?SKINS:THEMES).some(x=>x.id===p[k]))p[k]=DEF[k]});
 if(!MODES[p.mode])p.mode='classic';
 ['ach','scores'].forEach(k=>{if(!Array.isArray(p[k]))p[k]=[]});
 ['skin','theme'].forEach(k=>{if(!Array.isArray(p.own[k]))p.own[k]=[DEF[k]]});
 if(typeof p.records!=='object'||!p.records)p.records={};
 p.name=String(p.name||'Player').slice(0,18);
 const d=new Date().toLocaleDateString('en-CA');
 if(p.day!==d){p.day=d;p.daily=0;p.claimed=false}
 return p;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(P))}catch(e){}}

/* ---------- Helpers: toast, audio, haptics ---------- */
function toast(t){const e=document.createElement('div');e.textContent=t;$('#toasts').append(e);setTimeout(()=>e.remove(),2600)}
let AC=null,MG=null;
function audio(){
 if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.connect(AC.destination)}catch(e){AC=null}}
 if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});
 if(MG)MG.gain.value=P.set.vol/100;
 return AC;
}
function tone(f,d=.12,type='triangle',v=.14,slide=.6){
 if(P.set.vol<=0||!audio())return;
 try{
  const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(Math.max(40,f*slide),t+d);
  g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);
  o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+.03);
 }catch(e){}
}
const SFX={
 eat:()=>tone(620,.12),gold:()=>{tone(900,.12);setTimeout(()=>tone(1200,.15),90)},
 power:()=>{tone(500,.1);setTimeout(()=>tone(800,.16),80)},
 level:()=>{[520,660,880].forEach((f,i)=>setTimeout(()=>tone(f,.14),i*90))},
 over:()=>tone(170,.55,'sawtooth',.16,.4),tick:()=>tone(440,.07,'square',.06,1)};
const buzz=ms=>{if(P.set.haptic&&navigator.vibrate)try{navigator.vibrate(ms)}catch(e){}};

/* ---------- Game state ---------- */
const cv=$('#c'),g=cv.getContext('2d');
let cols,rows,cw,ch;
let snake=[],prev=[],dir={x:1,y:0},q=[],food=null,obs=[];
let parts=[],floats=[],state='menu';
let score,level,eaten,combo,lastEat,elapsed,hazT,power,powerT,acc,cd,shake,runMax,newBest,interval=120;

function setBoard(){const b=BOARDS[P.set.board]||BOARDS.medium;cols=b[0];rows=b[1];cw=W/cols;ch=H/rows}
const skin=()=>SKINS.find(s=>s.id===P.skin)||SKINS[0];
const theme=()=>THEMES.find(s=>s.id===P.theme)||THEMES[0];
const free=(x,y)=>!snake.some(s=>s.x===x&&s.y===y)&&!obs.some(o=>o.x===x&&o.y===y)&&!(food&&food.x===x&&food.y===y);
function randFree(minDist=0){
 for(let i=0;i<600;i++){
  const x=Math.random()*cols|0,y=Math.random()*rows|0;
  if(free(x,y)&&(!minDist||Math.abs(x-snake[0].x)+Math.abs(y-snake[0].y)>minDist))return{x,y};
 }
 for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)if(free(x,y))return{x,y};
 return null;
}
function addObstacles(n,dist){for(let i=0;i<n;i++){const p=randFree(dist);if(p)obs.push(p)}}
function spawnFood(){
 const p=randFree();
 if(!p){return gameOver('You filled the whole board!')}
 const r=Math.random();
 const type=r>.95?'gold':r>.89?'double':r>.83?'shield':r>.77?'slow':'normal';
 food={...p,type,ttl:type==='normal'?0:8000};
}

/* ---------- Flow ---------- */
function startRun(){
 setBoard();audio();
 const sx=cols*.4|0,sy=rows/2|0;
 snake=[0,1,2].map(i=>({x:sx-i,y:sy}));prev=snake.map(s=>({...s}));
 dir={x:1,y:0};q=[];obs=[];parts=[];floats=[];food=null;
 score=0;level=1;eaten=0;combo=1;lastEat=-1e9;elapsed=0;hazT=0;power=null;powerT=0;acc=0;shake=0;newBest=false;
 runMax={len:3,combo:1};
 if(P.mode==='obstacle')addObstacles(Math.floor(cols*rows*.025),6);
 if(P.mode==='survival')addObstacles(Math.floor(cols*rows*.012),7);
 spawnFood();
 P.games++;save();
 beginCountdown(2400);
}
function beginCountdown(ms){state='countdown';cd=ms;hideOv();hud()}
function hideOv(){$('#ov').classList.add('hidden')}
function showOv(html){$('#ovBox').innerHTML=html;$('#ov').classList.remove('hidden');const b=$('#ovBox button.primary');if(b)b.focus({preventScroll:true})}
function menuOv(){
 showOv(`<h1>NEON//SNAKE</h1><p>Eat energy, chain combos, grab power-ups and unlock new skins and worlds.</p>
 <div class="row"><button class="primary" data-a="start">▶ Start game</button><button data-a="shop">Open shop</button></div>`);
}
function togglePause(){
 if(state==='playing'||state==='countdown'){
  state='paused';
  showOv(`<h1>PAUSED</h1><p>Your run is safe.</p><div class="row"><button class="primary" data-a="resume">▶ Resume</button><button data-a="quit">End run</button></div>`);
  $('#bPause').textContent='Resume';
 }else if(state==='paused'){resume()}
}
function resume(){if(state==='paused'){$('#bPause').textContent='Pause';beginCountdown(1800)}}
function quitRun(){if(state==='paused'||state==='playing'||state==='countdown'){state='menu';$('#bPause').textContent='Pause';menuOv();hud()}}

function gameOver(reason){
 if(state==='over'||state==='menu')return;
 state='over';SFX.over();buzz([60,40,120]);
 shake=300;
 const bonus=Math.floor(score/50);P.coins+=bonus;
 if(score>P.best){P.best=score;newBest=score>0}
 if(score>(P.records[P.mode]||0))P.records[P.mode]=score;
 if(score>0){P.scores.push({n:P.name,s:score,m:MODES[P.mode][0],d:P.day});P.scores.sort((a,b)=>b.s-a.s);P.scores=P.scores.slice(0,10)}
 check();save();hud();renderTab();
 showOv(`${newBest?'<div class="badge">★ NEW PERSONAL BEST</div>':''}<h1>GAME OVER</h1>
 <p>${esc(reason)}<br>Score <b>${score}</b> · Level <b>${level}</b> · Length <b>${snake.length}</b>${bonus?` · +${bonus} shards`:''}</p>
 <div class="row"><button class="primary" data-a="start">↻ Play again</button><button data-a="share">Share score</button></div>`);
}

/* ---------- Input ---------- */
const DIRS={u:{x:0,y:-1},d:{x:0,y:1},l:{x:-1,y:0},r:{x:1,y:0}};
function steer(d){
 if(state!=='playing'&&state!=='countdown')return;
 const last=q.length?q[q.length-1]:dir;
 if(d.x===-last.x&&d.y===-last.y)return;
 if(d.x===last.x&&d.y===last.y)return;
 if(q.length<2)q.push(d);
}
const KEYS={ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d',ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r'};
addEventListener('keydown',e=>{
 if(e.target.matches('input,select'))return;
 const k=KEYS[e.code];
 if(k){e.preventDefault();steer(DIRS[k]);return}
 if(e.code==='Space'||e.code==='KeyP'){e.preventDefault();if(state==='menu'||state==='over')startRun();else togglePause()}
 else if(e.code==='Enter'&&(state==='menu'||state==='over')){startRun()}
 else if(e.code==='KeyM')toggleSound();
 else if(e.code==='Escape')closeMenu();
});
document.querySelectorAll('[data-d]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();steer(DIRS[b.dataset.d])}));
let ts=null;
cv.addEventListener('touchstart',e=>{const t=e.touches[0];ts={x:t.clientX,y:t.clientY}},{passive:true});
cv.addEventListener('touchmove',e=>{
 if(!ts)return;const t=e.touches[0],dx=t.clientX-ts.x,dy=t.clientY-ts.y;
 if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
 steer(Math.abs(dx)>Math.abs(dy)?(dx>0?DIRS.r:DIRS.l):(dy>0?DIRS.d:DIRS.u));
 ts={x:t.clientX,y:t.clientY};
},{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&P.set.pause&&(state==='playing'||state==='countdown'))togglePause()});

/* ---------- Simulation ---------- */
function getInterval(){
 const d=DIFF[P.set.diff]||DIFF.normal;
 let v=d.base-(level-1)*d.step;
 if(P.mode==='survival')v*=.9;
 if(power==='slow')v*=1.5;
 return Math.max(d.min,v);
}
function burst(x,y,c,n=16){
 if(!P.set.fx||P.set.reduce)return;
 for(let i=0;i<n;i++){const a=Math.random()*6.283,s=30+Math.random()*110;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:350+Math.random()*400,c})}
}
function step(){
 prev=snake.map(s=>({x:s.x,y:s.y}));
 if(q.length)dir=q.shift();
 let nx=snake[0].x+dir.x,ny=snake[0].y+dir.y;
 const zen=P.mode==='zen';
 if(nx<0||ny<0||nx>=cols||ny>=rows){
  if(P.set.walls==='wrap'||zen){nx=(nx+cols)%cols;ny=(ny+rows)%rows}
  else if(power==='shield'){power=null;powerT=0;nx=(nx+cols)%cols;ny=(ny+rows)%rows;toast('Shield used');SFX.power()}
  else return gameOver('You hit the wall.');
 }
 const eating=food&&food.x===nx&&food.y===ny;
 if(!zen){
  const bi=snake.findIndex((s,i)=>s.x===nx&&s.y===ny&&(eating||i<snake.length-1));
  const oi=obs.findIndex(o=>o.x===nx&&o.y===ny);
  if(bi>=0||oi>=0){
   if(power==='shield'){
    power=null;powerT=0;toast('Shield saved you!');SFX.power();buzz(40);
    if(bi>=0)snake=snake.slice(0,Math.max(3,bi));
    if(oi>=0)obs.splice(oi,1);
   }else return gameOver(bi>=0?'You bit your own tail.':'You hit an obstacle.');
  }
 }
 snake.unshift({x:nx,y:ny});
 if(eating)eat();else snake.pop();
 runMax.len=Math.max(runMax.len,snake.length);
}
function eat(){
 const f=food,d=DIFF[P.set.diff]||DIFF.normal;
 combo=elapsed-lastEat<3000?Math.min(5,combo+1):1;lastEat=elapsed;runMax.combo=Math.max(runMax.combo,combo);
 const mode=P.mode==='obstacle'?1.2:P.mode==='survival'?1.3:1;
 const pts=Math.round(FOOD[f.type].pts*combo*(power==='double'?2:1)*mode*d.pts);
 score+=pts;eaten++;P.foods++;P.daily=Math.min(10,P.daily+1);P.coins+=f.type==='gold'?5:1;
 const x=(f.x+.5)*cw,y=(f.y+.5)*ch;
 burst(x,y,FOOD[f.type].c,18);
 floats.push({x,y,t:'+'+pts+(combo>1?' x'+combo:''),l:900});
 if(P.set.shake&&!P.set.reduce)shake=120;
 if(f.type==='gold'){SFX.gold();toast('Golden crystal · +5 shards')}else SFX.eat();
 buzz(12);
 if(POWER[f.type]){power=f.type;powerT=8000;SFX.power();toast(POWER[f.type]+' active')}
 const nl=Math.min(20,Math.floor(eaten/5)+1);
 if(nl>level){level=nl;P.coins+=5;SFX.level();toast('Level '+level+' · +5 shards');burst(x,y,'#fff',26)}
 spawnFood();check();save();hud();
}
function update(dt){
 elapsed+=dt;
 if(powerT>0){powerT-=dt;if(powerT<=0)power=null}
 if(food&&food.ttl){food.ttl-=dt;if(food.ttl<=0){food.type='normal';food.ttl=0}}
 if(combo>1&&elapsed-lastEat>3000)combo=1;
 if(P.mode==='survival'){
  hazT+=dt;
  if(hazT>=10000){hazT=0;if(obs.length<cols*rows*.06){addObstacles(1,6);toast('New hazard in the arena')}}
 }
}

/* ---------- Achievements & missions ---------- */
const ACH=[
 ['First bite','Eat your first food',()=>P.foods>=1],
 ['Hungry','Eat 100 food in total',()=>P.foods>=100],
 ['Long snake','Reach length 20',()=>runMax&&runMax.len>=20],
 ['Combo master','Reach a x5 combo',()=>runMax&&runMax.combo>=5],
 ['High scorer','Score 500 in one run',()=>P.best>=500],
 ['Veteran','Reach level 8',()=>level>=8&&state!=='menu'],
 ['Fashionista','Buy a cosmetic',()=>P.buys>=1],
 ['Daily grind','Claim a daily reward',()=>P.claimed]];
function check(){
 ACH.forEach((a,i)=>{if(!P.ach.includes(i)&&a[2]()){P.ach.push(i);toast('Achievement · '+a[0]);SFX.level()}});
}

/* ---------- Rendering ---------- */
const rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mix=(a,b,t)=>{const x=rgb(a),y=rgb(b);return 'rgb('+x.map((v,i)=>Math.round(v+(y[i]-v)*t)).join()+')'};
function segColor(i,n,now){const s=skin();return s.a==='rainbow'?`hsl(${(now/12+i*14)%360} 95% 62%)`:mix(s.a,s.b,i/Math.max(1,n-1))}
function eyes(x,y){
 const s=cw*.14,fx=dir.x,fy=dir.y,sx=-fy,sy=fx;
 g.fillStyle='#03101d';
 for(const k of[-1,1]){
  g.beginPath();g.arc(x+fx*s*1.1+sx*s*1.2*k,y+fy*s*1.1+sy*s*1.2*k,Math.max(2,cw*.1),0,6.283);g.fill();
 }
}
function draw(now){
 const th=theme();
 g.clearRect(0,0,W,H);g.save();
 if(shake>0&&P.set.shake&&!P.set.reduce){const a=4*shake/300;g.translate((Math.random()-.5)*a*2,(Math.random()-.5)*a*2)}
 const gr=g.createLinearGradient(0,0,W,H);gr.addColorStop(0,th.a);gr.addColorStop(1,th.b);
 g.fillStyle=gr;g.fillRect(-10,-10,W+20,H+20);
 if(P.set.grid){
  g.strokeStyle=th.g+'30';g.lineWidth=1;g.beginPath();
  for(let x=0;x<=W;x+=cw){g.moveTo(x,0);g.lineTo(x,H)}
  for(let y=0;y<=H;y+=ch){g.moveTo(0,y);g.lineTo(W,y)}
  g.stroke();
 }
 if(P.set.walls==='solid'&&P.mode!=='zen'){g.strokeStyle='#ff647e';g.lineWidth=3;g.strokeRect(1.5,1.5,W-3,H-3)}
 // obstacles
 obs.forEach(o=>{
  g.save();g.fillStyle='#1c334b';g.strokeStyle='#ff627b';g.lineWidth=1.5;g.shadowColor='#ff5367';g.shadowBlur=P.set.fx?8:0;
  g.beginPath();g.roundRect(o.x*cw+2,o.y*ch+2,cw-4,ch-4,4);g.fill();g.stroke();g.restore();
 });
 // food
 if(food){
  const c=FOOD[food.type].c,x=(food.x+.5)*cw,y=(food.y+.5)*ch,r=Math.min(cw,ch);
  const blink=food.ttl&&food.ttl<2000&&Math.floor(now/120)%2;
  if(!blink){
   g.save();g.translate(x,y);
   const pulse=P.set.reduce?1:1+Math.sin(now/200)*.12;
   g.scale(pulse,pulse);g.fillStyle=c;g.shadowColor=c;g.shadowBlur=P.set.fx?18:0;
   g.beginPath();
   if(food.type==='gold'){g.rotate(Math.PI/4);g.rect(-r*.25,-r*.25,r*.5,r*.5)}
   else if(food.type==='shield'){g.moveTo(0,-r*.34);g.lineTo(r*.3,-r*.12);g.lineTo(r*.2,r*.25);g.lineTo(0,r*.36);g.lineTo(-r*.2,r*.25);g.lineTo(-r*.3,-r*.12);g.closePath()}
   else g.arc(0,0,r*(food.type==='normal'?.2:.3),0,6.283);
   g.fill();g.restore();
  }
 }
 // snake (interpolated)
 if(snake.length){
  const t=state==='playing'?clamp(acc/interval,0,1):1,n=snake.length,sz=cw*.82;
  for(let i=n-1;i>=0;i--){
   const s=snake[i],p=prev[i]||s;
   let px=s.x,py=s.y;
   if(Math.abs(s.x-p.x)<=1&&Math.abs(s.y-p.y)<=1){px=p.x+(s.x-p.x)*t;py=p.y+(s.y-p.y)*t}
   const x=(px+.5)*cw,y=(py+.5)*ch,col=segColor(i,n,now);
   g.save();g.globalAlpha=1-i/n*.35;g.fillStyle=col;
   if(i===0&&P.set.fx){g.shadowColor=col;g.shadowBlur=16}
   g.beginPath();g.roundRect(x-sz/2,y-sz/2,sz,sz,cw*.3);g.fill();g.restore();
   if(i===0){
    eyes(x,y);
    if(power==='shield'){g.strokeStyle='#42eaff';g.lineWidth=2;g.globalAlpha=.7;g.beginPath();g.arc(x,y,cw*.85,0,6.283);g.stroke();g.globalAlpha=1}
   }
  }
 }
 // effects
 parts.forEach(p=>{g.globalAlpha=clamp(p.l/700,0,1);g.fillStyle=p.c;g.fillRect(p.x,p.y,3,3)});
 g.globalAlpha=1;
 floats.forEach(f=>{g.globalAlpha=clamp(f.l/900,0,1);g.fillStyle='#fff';g.font='bold 16px system-ui';g.textAlign='center';g.fillText(f.t,f.x,f.y-(900-f.l)*.035)});
 g.globalAlpha=1;g.restore();
 if(state==='countdown'){
  g.fillStyle='#020813aa';g.fillRect(0,0,W,H);
  g.fillStyle='#35f2c8';g.shadowColor='#35f2c8';g.shadowBlur=24;g.font='bold 96px system-ui';g.textAlign='center';g.textBaseline='middle';
  g.fillText(String(Math.max(1,Math.ceil(cd/800))),W/2,H/2);g.shadowBlur=0;g.textBaseline='alphabetic';
 }
}
function resize(){
 const w=cv.clientWidth||W,d=Math.min(2,devicePixelRatio||1);
 cv.width=Math.round(w*d);cv.height=Math.round(w*2/3*d);
 g.setTransform(cv.width/W,0,0,cv.height/H,0,0);
}
if(window.ResizeObserver)new ResizeObserver(resize).observe(cv);else addEventListener('resize',resize);

/* ---------- HUD ---------- */
function hud(){
 $('#hScore').textContent=score|0;$('#hBest').textContent=P.best;$('#hLevel').textContent=level||1;
 $('#hBar').style.width=((eaten||0)%5)*20+'%';
 let s='Ready';
 if(state==='playing'||state==='countdown'){
  s=(combo>1?`<span class="chip">Combo x${combo}</span> `:'')+(power?`<span class="chip">${POWER[power]} ${(powerT/1000).toFixed(1)}s</span>`:'');
  if(!s)s=MODES[P.mode][0]+' mode';
 }else if(state==='paused')s='Paused';else if(state==='over')s='Run ended';
 $('#hStatus').innerHTML=s;
}

/* ---------- Side panel ---------- */
let tab='play';
const fld=(label,ctl,sub='')=>`<div class="row2"><div>${label}${sub?`<small>${sub}</small>`:''}</div>${ctl}</div>`;
const opts=(arr,cur)=>arr.map(([v,l])=>`<option value="${v}"${v===cur?' selected':''}>${l}</option>`).join('');
const chk=k=>`<input type="checkbox" data-s="${k}"${P.set[k]?' checked':''}>`;
function renderTab(){
 document.querySelectorAll('[data-t]').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===tab));
 const el=$('#tab');
 if(tab==='play'){
  el.innerHTML=`<h2>Game mode</h2>`+Object.entries(MODES).map(([k,v])=>
   `<button class="mode" data-a="mode" data-v="${k}" aria-pressed="${P.mode===k}"><b>${v[0]}</b><small>${v[1]}</small></button>`).join('')+
  `<h2>Daily mission</h2><div class="card"><b style="color:var(--gold)">Energy collector</b>
   <div class="sm">Eat 10 food today to earn 50 shards.</div>
   <div class="row2"><span>Progress</span><b>${P.daily} / 10</b></div>
   <div class="bar"><i style="width:${P.daily*10}%"></i></div>
   <button class="primary" data-a="claim" style="width:100%;margin-top:10px"${P.claimed||P.daily<10?' disabled':''}>${P.claimed?'Reward collected':P.daily<10?'Eat '+(10-P.daily)+' more':'Claim 50 shards'}</button></div>
   <h2>Power-ups</h2><p class="sm" style="margin:0">Pink: double score · Cyan shield: survive one crash · Purple: slow motion · Gold: +50 and 5 shards. Chain food within 3 seconds for up to x5 combo.</p>`;
 }else if(tab==='shop'){
  const item=(type,x,own)=>{
   const eq=P[type]===x.id,has=own.includes(x.id);
   const bg=x.a==='rainbow'?'linear-gradient(90deg,red,orange,yellow,green,blue,violet)':`linear-gradient(135deg,${x.a},${x.b})`;
   return `<div class="row2"><div style="display:flex;gap:9px;align-items:center"><div class="sw" style="background:${bg}"></div><div>${x.n}<small>${has?'Owned':x.p+' shards'}</small></div></div>
   <button data-a="${has?'equip':'buy'}" data-k="${type}" data-v="${x.id}"${eq||(!has&&P.coins<x.p)?' disabled':''}>${eq?'Equipped':has?'Equip':'Buy'}</button></div>`;
  };
  el.innerHTML=`<div class="row2"><span>Balance</span><b style="color:var(--gold)">${P.coins} ✦ shards</b></div>
   <h2>Snake skins</h2>${SKINS.map(x=>item('skin',x,P.own.skin)).join('')}
   <h2>Worlds</h2>${THEMES.map(x=>item('theme',x,P.own.theme)).join('')}`;
 }else if(tab==='me'){
  el.innerHTML=`<h2>Player</h2>${fld('Name',`<input data-s="name" maxlength="18" value="${esc(P.name)}" style="width:140px">`)}
   ${fld('Games played',`<b>${P.games}</b>`)}${fld('Total food',`<b>${P.foods}</b>`)}${fld('Best score',`<b>${P.best}</b>`)}
   <h2>Top 10 scores</h2>${P.scores.length?P.scores.map((s,i)=>fld(`${i+1}. ${esc(s.n)}`,`<b>${s.s}</b>`,esc(s.m)+' · '+esc(s.d))).join(''):'<p class="sm">No scores yet. Play a run to set one.</p>'}
   <h2>Achievements · ${P.ach.length}/${ACH.length}</h2>${ACH.map((a,i)=>fld((P.ach.includes(i)?'✓ ':'○ ')+a[0],'',a[1])).join('')}
   <h2>Data</h2><button class="danger" data-a="wipe" style="width:100%">Delete all progress</button>`;
 }else{
  const S=P.set;
  el.innerHTML=`<h2>Gameplay (applies to next run)</h2>
   ${fld('Difficulty',`<select data-s="diff">${opts([['easy','Easy'],['normal','Normal'],['hard','Hard']],S.diff)}</select>`)}
   ${fld('Board size',`<select data-s="board">${opts([['small','Small'],['medium','Medium'],['large','Large']],S.board)}</select>`)}
   ${fld('Walls',`<select data-s="walls">${opts([['wrap','Wrap around'],['solid','Deadly']],S.walls)}</select>`)}
   <h2>Audio & feel</h2>
   ${fld('Volume',`<input type="range" min="0" max="100" data-s="vol" value="${S.vol}">`)}
   ${fld('Vibration',chk('haptic'))}${fld('Screen shake',chk('shake'))}
   <h2>Display</h2>
   ${fld('Show grid',chk('grid'))}${fld('Particles & glow',chk('fx'))}${fld('Reduce motion',chk('reduce'))}${fld('Auto-pause on tab switch',chk('pause'))}`;
 }
}
$('#tab').addEventListener('change',e=>{
 const k=e.target.dataset.s;if(!k)return;
 if(k==='name')P.name=e.target.value.trim().slice(0,18)||'Player';
 else if(e.target.type==='checkbox')P.set[k]=e.target.checked;
 else if(e.target.type==='range')P.set[k]=+e.target.value;
 else P.set[k]=e.target.value;
 save();sound();
});
$('#tab').addEventListener('input',e=>{if(e.target.dataset.s==='vol'){P.set.vol=+e.target.value;audio();sound()}});

/* ---------- Actions ---------- */
function act(a,el){
 if(a==='start')startRun();
 else if(a==='resume')resume();
 else if(a==='quit')quitRun();
 else if(a==='shop'){tab='shop';renderTab();openMenu()}
 else if(a==='mode'){
  P.mode=el.dataset.v;save();renderTab();
  if(state==='playing'||state==='paused'||state==='countdown'){state='menu';menuOv()}
  hud();
 }else if(a==='claim'){
  if(!P.claimed&&P.daily>=10){P.claimed=true;P.coins+=50;toast('Daily reward · +50 shards');SFX.level();check();save();renderTab()}
 }else if(a==='buy'||a==='equip'){
  const list=el.dataset.k==='skin'?SKINS:THEMES,x=list.find(i=>i.id===el.dataset.v),own=P.own[el.dataset.k];
  if(!x)return;
  if(a==='buy'){
   if(P.coins<x.p||own.includes(x.id))return;
   P.coins-=x.p;own.push(x.id);P.buys++;toast('Unlocked · '+x.n);SFX.power();check();
  }
  P[el.dataset.k]=x.id;save();renderTab();
 }else if(a==='share'){
  const t=`I scored ${score} on NEON//SNAKE (${MODES[P.mode][0]}, level ${level}). Can you beat it?`;
  if(navigator.share)navigator.share({title:'NEON//SNAKE',text:t}).catch(()=>{});
  else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('Score copied to clipboard'),()=>toast(t));
  else toast(t);
 }else if(a==='wipe'){
  if(confirm('Delete ALL progress, shards and unlocks?')){try{localStorage.removeItem(KEY);localStorage.removeItem(OLD)}catch(e){}location.reload()}
 }
}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-t]');if(t){tab=t.dataset.t;renderTab();return}
 const a=e.target.closest('[data-a]');if(a)act(a.dataset.a,a);
});
$('#bPause').onclick=()=>{if(state==='menu'||state==='over')startRun();else togglePause()};
function sound(){$('#bSound').textContent='Sound: '+(P.set.vol>0?'On':'Off')}
function toggleSound(){P.set.vol=P.set.vol>0?0:60;save();sound();if(tab==='set')renderTab()}
$('#bSound').onclick=toggleSound;
$('#bFull').onclick=()=>{const d=document;if(d.fullscreenElement)d.exitFullscreen();else if(d.documentElement.requestFullscreen)d.documentElement.requestFullscreen().catch(()=>{})};
const side=$('#side'),scrim=$('#scrim');
function openMenu(){if(state==='playing'||state==='countdown')togglePause();side.classList.add('open');scrim.classList.add('on')}
function closeMenu(){side.classList.remove('open');scrim.classList.remove('on')}
$('#bMenu').onclick=openMenu;$('#bClose').onclick=closeMenu;scrim.onclick=closeMenu;
addEventListener('pagehide',save);

/* ---------- Main loop ---------- */
let last=0,hudT=0;
function frame(now){
 const dt=Math.min(100,now-(last||now));last=now;
 if(state==='countdown'){
  const before=Math.ceil(cd/800);cd-=dt;
  if(Math.ceil(cd/800)!==before&&cd>0)SFX.tick();
  if(cd<=0){state='playing';acc=0;SFX.eat()}
 }else if(state==='playing'){
  update(dt);acc+=dt;interval=getInterval();
  while(acc>=interval&&state==='playing'){step();acc-=interval}
 }
 if(shake>0)shake=Math.max(0,shake-dt);
 for(const p of parts){p.x+=p.vx*dt/1000;p.y+=p.vy*dt/1000;p.vx*=.985;p.vy*=.985;p.l-=dt}
 parts=parts.filter(p=>p.l>0);
 for(const f of floats)f.l-=dt;
 floats=floats.filter(f=>f.l>0);
 hudT+=dt;if(hudT>100){hudT=0;hud()}
 draw(now);
 requestAnimationFrame(frame);
}

/* ---------- Init ---------- */
setBoard();resize();sound();renderTab();hud();menuOv();
if(notice)setTimeout(()=>toast(notice),400);
save();requestAnimationFrame(frame);
})();
</script>
</body>
